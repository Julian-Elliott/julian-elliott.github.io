name: Refresh the spine (daily NESO means)

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; yesterday's mean is final by then
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/refresh_spine.py
      - name: Commit if changed
        run: |
          git config user.name "spine-refresh"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- src/data/spine.json; then
            git add src/data/spine.json
            git commit -m "spine: daily means to $(date -u +%Y-%m-%d) (NESO, CC BY 4.0)"
            git push
          fi
